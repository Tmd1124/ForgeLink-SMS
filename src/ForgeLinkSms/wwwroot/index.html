<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>ForgeLink SMS</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="ForgeLinkSms.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body data-theme="dark">

    <div class="status-bar-safe-area"></div>

    <div id="app"></div>

    <div id="blazor-error-ui" role="alertdialog" aria-labelledby="blazor-error-title">
        <div class="error-card">
            <div class="error-title" id="blazor-error-title">⚠️ Something went wrong</div>
            <div class="error-subtitle">ForgeLink hit an unexpected error. Details:</div>
            <pre id="blazor-error-details">No details were captured.</pre>
            <div class="error-actions">
                <button type="button" id="blazor-error-copy">Copy</button>
                <a class="dismiss" role="button">Close</a>
                <a href="" class="reload" role="button">Reload</a>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/infiniteScroll.js"></script>
    <script src="js/bubblePond.js"></script>
    <script src="js/backSwipe.js"></script>
    <script src="js/errorDetails.js"></script>
    <script src="js/twoPane.js"></script>
    <script src="js/filterTabs.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
