trigger:
  - master

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  testProject: tests/ForgeLinkSms.Core.Tests/ForgeLinkSms.Core.Tests.csproj

steps:
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet restore $(testProject)
    displayName: Restore

  - script: dotnet build $(testProject) --configuration $(buildConfiguration) --no-restore
    displayName: Build

  - script: dotnet test $(testProject) --configuration $(buildConfiguration) --no-build --logger trx
    displayName: Test

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
